name: Mirror issue to main repo

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: mirror-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # The GitHub App must be installed on MAIN_REPO with Issues read/write.
      - name: Generate main-repo token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.MAIN_REPO }}

      - name: Create issue in main repo
        id: create
        uses: actions/github-script@v7
        env:
          # Issue text is untrusted. Pass it via env, never inline into script.
          SRC_TITLE: ${{ github.event.issue.title }}
          SRC_BODY: ${{ github.event.issue.body }}
          SRC_URL: ${{ github.event.issue.html_url }}
          SRC_AUTHOR: ${{ github.event.issue.user.login }}
          SRC_NUMBER: ${{ github.event.issue.number }}
          SRC_REPO: ${{ github.repository }}
          MAIN_REPO: ${{ vars.MAIN_REPO }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = process.env.MAIN_REPO;
            const ref = `${process.env.SRC_REPO}#${process.env.SRC_NUMBER}`;
            const marker = `<!-- public-issue: ${ref} -->`;

            // Skip if a mirror already exists. Guards re-runs and retries.
            const q = `repo:${owner}/${repo} is:issue in:body "${ref}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (found.data.total_count > 0) {
              core.info(`Mirror already exists: #${found.data.items[0].number}`);
              core.setOutput('number', found.data.items[0].number);
              return;
            }

            const body = [
              marker,
              `**Source:** ${process.env.SRC_URL}`,
              `**Reported by:** @${process.env.SRC_AUTHOR}`,
              '',
              '---',
              '',
              process.env.SRC_BODY || '_(no description)_',
            ].join('\n');

            const res = await github.rest.issues.create({
              owner,
              repo,
              title: `[public #${process.env.SRC_NUMBER}] ${process.env.SRC_TITLE}`,
              body,
              labels: ['from-public'],
            });
            core.setOutput('number', res.data.number);

      # Uses the default GITHUB_TOKEN so the comment never references the private repo.
      - name: Acknowledge on public issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks for the report. This has been queued for triage.',
            });
